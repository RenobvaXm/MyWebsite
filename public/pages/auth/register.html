<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Register | RENOBVA</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/professional.css"></head>
  <body class="portal-body">
    <main class="auth-layout">
      <section class="auth-art">
        <a class="portal-logo" href="../../index.html"
          ><img src="../../assets/images/brand/logo-icon.svg" /> RENOBVA</a
        >
        <div>
          <span class="eyebrow">CLIENT PORTAL</span>
          <h1>
            Build something<br /><span class="gradient"
              >worth remembering.</span
            >
          </h1>
        </div>
        <small>Secure project workspace • RENOBVA</small>
      </section>
      <section class="auth-box">
        <div class="auth-card">
          <span class="eyebrow">CREATE ACCOUNT</span>
          <h2>Join RENOBVA.</h2>
          <p>Your projects, questions and messages in one place.</p>
          <form class="form-stack" data-auth="register">
            <label>Your name<input name="display_name" required /></label
            ><label>Email<input name="email" type="email" required /></label
            ><label
              >Password<input
                name="password"
                type="password"
                minlength="8"
                required /></label
            ><button class="btn primary">Create account →</button>
          </form>
          <div class="auth-links">
            <span>Already registered? <a href="login.html">Sign in</a></span>
          </div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/modules/portal-core.js"></script>
    <script src="../../assets/js/modules/auth.js"></script>
  </body>
</html>
