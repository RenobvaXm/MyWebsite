<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Forgot Password | RENOBVA</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="portal-body">
    <main class="auth-layout">
      <section class="auth-art">
        <a class="portal-logo" href="../../index.html"
          ><img src="../../assets/images/brand/logo-icon.svg" /> RENOBVA</a
        >
        <div>
          <span class="eyebrow">CLIENT PORTAL</span>
          <h1>
            Build something<br /><span class="gradient"
              >worth remembering.</span
            >
          </h1>
        </div>
        <small>Secure project workspace • RENOBVA</small>
      </section>
      <section class="auth-box">
        <div class="auth-card">
          <span class="eyebrow">PASSWORD</span>
          <h2>Reset access.</h2>
          <p>We'll send a password reset link to your email.</p>
          <form class="form-stack" id="resetForm">
            <label>Email<input name="email" type="email" required /></label
            ><button class="btn primary">Send reset link →</button>
          </form>
          <div class="auth-links"><a href="login.html">← Back to login</a></div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/modules/portal-core.js"></script>
    <script src="../../assets/js/modules/auth.js"></script>
  </body>
</html>
