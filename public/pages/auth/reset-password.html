<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Reset Password | RENOBVA</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/professional.css"></head>
  <body class="portal-body">
    <main class="auth-layout">
      <section class="auth-art">
        <a class="portal-logo" href="../../index.html"
          ><img src="../../assets/images/brand/logo-icon.svg" /> RENOBVA</a
        >
        <div>
          <span class="eyebrow">CLIENT PORTAL</span>
          <h1>
            Build something<br /><span class="gradient"
              >worth remembering.</span
            >
          </h1>
        </div>
        <small>Secure project workspace • RENOBVA</small>
      </section>
      <section class="auth-box">
        <div class="auth-card">
          <span class="eyebrow">PASSWORD</span>
          <h2>Choose a new password.</h2>
          <p>Open this page using the reset link sent to your email.</p>
          <form class="form-stack" id="newPasswordForm">
            <label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required /></label><label>Confirm password<input name="confirm" type="password" minlength="8" autocomplete="new-password" required /></label
            ><button class="btn primary">Update password →</button>
          </form>
          <div class="auth-links"><a href="login.html">← Back to login</a></div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/modules/portal-core.js"></script>
    <script src="../../assets/js/modules/reset-password.js"></script>
  </body>
</html>
