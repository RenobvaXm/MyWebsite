<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Client Chat | RENOBVA Admin</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body class="portal-body">
    <div class="portal-shell">
      <aside class="portal-side">
        <a class="portal-logo" href="../../index.html"
          ><img src="../../assets/images/brand/logo-icon.svg" /> RENOBVA
          <small style="color: #ff7955">ADMIN</small></a
        >
        <nav class="side-nav">
          <a class="active" href="dashboard.html">⌂ Dashboard</a
          ><a href="../portal/dashboard.html">Client view</a
          ><a href="../portal/new-project.html">＋ New Project</a>
        </nav>
        <div class="side-bottom">
          <button onclick="logout()">↪ Sign out</button>
        </div>
      </aside>
      <main class="portal-main">
        <div class="portal-top">
          <a href="../../index.html">← Website</a>
          <div class="user-chip">
            <span class="avatar">A</span><span data-user-name>Admin</span>
          </div>
        </div>
        <section class="portal-title">
          <span class="eyebrow" id="projectService">CLIENT PROJECT</span>
          <h1 id="projectTitle">Loading...</h1>
          <p>Status: <span class="status" id="projectStatus">loading</span></p>
          <div class="admin-project-controls" id="adminProjectControls" hidden>
            <label
              >Progress
              <select id="projectStatusSelect">
                <option>new</option>
                <option>questions</option>
                <option>in progress</option>
                <option>review</option>
                <option>completed</option>
                <option>cancelled</option>
              </select></label
            ><button class="close-ticket-btn" id="closeTicket">
              ✓ Close ticket
            </button>
          </div>
        </section>
        <div class="chat-layout">
          <div class="chat-head">
            <div>
              <h2>Client conversation</h2>
              <small style="color: #777">RENOBVA Admin</small>
            </div>
            <span class="dot"></span>
          </div>
          <div class="messages" id="messages"></div>
          <form class="chat-compose rich-compose" id="chatForm">
            <div class="chat-dropzone" id="chatDropzone" hidden>
              <div class="drop-icon">⇧</div>
              <strong>Drop to upload</strong>
              <span>Photos, documents or folders</span>
            </div>
            <div class="upload-menu" id="uploadMenu" hidden>
              <button type="button" class="upload-option" data-picker="image">
                <span class="upload-option-icon">▧</span
                ><span><b>Photo</b><small>JPG, PNG, WEBP, GIF</small></span>
              </button>
              <button type="button" class="upload-option" data-picker="file">
                <span class="upload-option-icon">⌑</span
                ><span
                  ><b>File</b><small>PDF, DOCX, TXT, ZIP & more</small></span
                >
              </button>
              <button type="button" class="upload-option" data-picker="folder">
                <span class="upload-option-icon">▱</span
                ><span
                  ><b>Folder</b><small>Upload a complete folder</small></span
                >
              </button>
            </div>
            <input
              id="chatImage"
              type="file"
              accept="image/*"
              multiple
              hidden
            />
            <input
              id="chatDocument"
              type="file"
              accept=".pdf,.doc,.docx,.txt,.rtf,.csv,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.7z,.json,.md"
              multiple
              hidden
            />
            <input
              id="chatFolder"
              type="file"
              webkitdirectory
              directory
              multiple
              hidden
            />
            <div class="upload-queue" id="uploadQueue" hidden></div>
            <div class="compose-row">
              <button
                class="attach-btn"
                id="attachMenuButton"
                type="button"
                aria-label="Add attachment"
                title="Add attachment"
              >
                ＋
              </button>
              <input
                name="message"
                autocomplete="off"
                placeholder="Write a message..."
              />
              <button class="btn primary" type="submit">Send</button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabase-config.js"></script>
    <script src="../../assets/js/modules/portal-core.js"></script>
    <script src="../../assets/js/modules/chat.js"></script>
  </body>
</html>
